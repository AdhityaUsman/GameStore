<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameStore Social - Masuk / Daftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo-auth">🎮 GameStore Social</div>
            
            <!-- Tab Navigasi Login / Register -->
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">Masuk</button>
                <button id="tab-register" class="tab-btn" onclick="switchTab('register')">Daftar Akun</button>
            </div>

            <!-- Form Login -->
            <form id="login-form" class="auth-form">
                <h2>Masuk ke Akun</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-user" placeholder="Masukkan username..." required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" placeholder="Masukkan password..." required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Masuk</button>
            </form>

            <!-- Form Register -->
            <form id="register-form" class="auth-form hidden">
                <h2>Buat Akun Baru</h2>
                <div class="form-group">
                    <label>Username Baru</label>
                    <input type="text" id="reg-user" placeholder="Buat username..." required>
                </div>
                <div class="form-group">
                    <label>Password Baru</label>
                    <input type="password" id="reg-pass" placeholder="Buat password..." required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; background-color: #25D366;">Daftar Sekarang</button>
            </form>
        </div>
        <div class="theme-toggle-auth">
            <button id="theme-toggle" class="theme-btn">☀️ / 🌙 Ganti Tema</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
